
services:

  # =================================
  # 1. FLASK WEB APPLICATION
  # =================================

  web:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: advanced_web

    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - frontend
      - backend

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =================================
  # 2. MYSQL DATABASE
  # =================================

  db:
    image: mysql:8.0

    container_name: advanced_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # =================================
  # 3. REDIS CACHE
  # =================================

  redis:
    image: redis:7-alpine

    container_name: advanced_redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - backend

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  # =================================
  # 4. NGINX REVERSE PROXY
  # =================================

  nginx:
    image: nginx:alpine

    container_name: advanced_nginx

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      web:
        condition: service_healthy

    networks:
      - frontend

    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1'
      interval: 15s
      timeout: 5s
      retries: 3

# =================================
# DOCKER NETWORKS
# =================================

networks:

  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

# =================================
# DOCKER VOLUMES
# =================================

volumes:

  mysql_data:
    driver: local

  redis_data:
    driver: local
